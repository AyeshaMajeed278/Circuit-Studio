// LAB 1 ─ Logic Gates
['Lesson 1','Logic Gates & Equipment','Breadboard, ICs, and basic gate truth tables',
`<b>Objective:</b> Introduction to trainer, breadboard, IC and power supply. Study logic gates and verify their truth tables.<br><br>
<b>Parts Required:</b> IC 7408 (AND), IC 7432 (OR), IC 7404 (NOT), IC 7400 (NAND 2-input), IC 7402 (NOR), IC 7486 (XOR), IC 7410 (NAND 3-input)<br><br>
<b>Theory — The Breadboard:</b> The breadboard has two terminal strips and two bus strips. Each row of 5 contacts is a node (connected inside). Bus strips are used for power supply connections. Build circuits on terminal strips by inserting component leads and connecting with 22–26 gauge wire. Connect +5V and 0V to separate bus strips.<br><br>
<b>⚠ Safety:</b> The 5V supply MUST NOT BE EXCEEDED — this damages ICs. Never connect power while wiring. Check polarity before switching on.<br><br>
<b>Building Steps:</b> (1) Turn power OFF before building. (2) Connect +5V to pin 14 and GND to pin 7 of each IC. (3) Plug ICs straddling the centre gap, pin 1 at top-left. (4) Mark connections as you go. (5) Have a group member check before powering on.<br><br>
<b>Gate Theory:</b><br>
• <b>AND:</b> Output HIGH only when ALL inputs HIGH. IC 7408.<br>
• <b>OR:</b> Output HIGH when ANY input is HIGH. IC 7432.<br>
• <b>NOT:</b> Inverter — output is complement of input. IC 7404.<br>
• <b>NAND:</b> AND-NOT. Output LOW only when all inputs HIGH. IC 7400.<br>
• <b>NOR:</b> OR-NOT. Output HIGH only when all inputs LOW. IC 7402.<br>
• <b>XOR:</b> Output HIGH when inputs are DIFFERENT. IC 7486.<br><br>
<b>Procedure:</b> Place IC on breadboard, connect VCC=5V to pin 14, GND to pin 7, connect inputs to switches SW1/SW2, output to LED. Switch ON and complete the truth table for each gate.<br><br>
<b>Lesson Task:</b> Build an Exclusive-OR gate using AND, OR, and NOT gates only (no XOR IC).`,
["AND=A*B","OR=A+B","NAND=(A*B)'","NOR=(A+B)'","XOR=A^B","NOT=A'"],
'Challenge: Build each gate on the canvas. Use switches A, B as inputs and LEDs named AND, OR, NAND, NOR, XOR, NOT as outputs. Press Generate → Truth Table to verify each one.'],

// LAB 2 ─ Verilog Introduction
['Lesson 2','Introduction to Verilog & HDL',`HDL design methodologies, module structure, and gate-level coding`,
`<b>Objective:</b> Introduction to HDL-based design using Verilog.<br><br>
<b>What is Verilog?</b> Hardware Description Language (HDL) — formally describes and designs digital logic circuits. Verilog (similar to C) is the most widely used HDL. Two popular HDLs: <b>Verilog</b> and <b>VHDL</b>.<br><br>
<b>Design Methodologies:</b><br>
• <b>Top-Down:</b> Define top-level block, then subdivide into sub-blocks until you reach leaf cells.<br>
• <b>Bottom-Up:</b> Identify available building blocks first, combine into bigger cells.<br><br>
<b>Module Structure:</b><br>
<code>module &lt;name&gt; (&lt;port_list&gt;); // outputs first, then inputs<br>  &lt;module body&gt;<br>endmodule</code><br><br>
<b>Abstraction Levels:</b><br>
• <b>Behavioural:</b> Describe algorithm (like C programming)<br>
• <b>Dataflow:</b> Describe how data flows between registers (assign statements)<br>
• <b>Gate Level:</b> Describe in terms of logic gates<br>
• <b>Switch Level:</b> Lowest level (rarely used today)<br><br>
<b>Key Syntax:</b><br>
• Comments: <code>// single line</code> or <code>/* multi-line */</code><br>
• Sized numbers: <code>4'b1111</code> (4-bit binary), <code>12'habc</code> (12-bit hex), <code>16'd255</code> (16-bit decimal)<br>
• Operators: Unary (<code>~a</code>), Binary (<code>a &amp;&amp; b</code>), Ternary (<code>a ? b : c</code>)<br>
• Identifiers are case-sensitive; keywords are lowercase<br><br>
<b>Gate Primitives in Verilog:</b> <code>and</code>, <code>or</code>, <code>not</code>, <code>nand</code>, <code>nor</code>, <code>xor</code>, <code>xnor</code><br><br>
<b>Testbench (Stimulus Block):</b><br>
<code>module Stimulus;<br>  reg A, B; // inputs become reg<br>  wire Y;  // outputs become wire<br>  &lt;module_instance&gt; uut(...);<br>  initial begin ... end<br>endmodule</code><br><br>
<b>Verilog for XOR from basic gates:</b><br>
<code>module xor_gates(A, B, Y);<br>  input A, B; output Y;<br>  wire nA, nB, w1, w2;<br>  not(nA, A); not(nB, B);<br>  and(w1, A, nB); and(w2, nA, B);<br>  or(Y, w1, w2);<br>endmodule</code><br><br>
<b>Lesson Task:</b> Write Verilog code for XOR gate using AND, OR, NOT gates.`,
["F=A*B'+A'*B"],
'Challenge: Build XOR from AND, OR, NOT on the canvas (no XOR gate allowed). Name inputs A, B and output F. Use Check to verify all 4 rows match.'],

// LAB 3 ─ De Morgan and Distributive Laws
['Lesson 3','De Morgan\'s & Distributive Laws','Verify boolean identities with gates and Verilog',
`<b>Objective:</b> Implement and verify De Morgan\'s Law and Distributive Law using gates.<br><br>
<b>Parts Required:</b> IC 7408 (AND), IC 7432 (OR), IC 7404 (NOT)<br><br>
<b>Distributive Law:</b><br>
• A(B + C) = AB + AC<br>
• (A + B)(C + D) = AC + AD + BC + BD<br><br>
<b>De Morgan\'s Law:</b><br>
• (A + B)′ = A′ · B′<br>
• (A · B)′ = A′ + B′<br><br>
<b>Theory:</b> De Morgan\'s theorem lets you convert between AND and OR forms by inverting all inputs and the output. This is fundamental for converting circuits to NAND-only or NOR-only implementations (using universal gates).<br><br>
<b>Truth Table — Distributive Law A(B+C) = AB+AC:</b><br>
Verify: for all combinations of A, B, C (000 to 111), the left side A(B+C) always equals the right side AB+AC.<br><br>
<b>Procedure:</b> (a) Place ICs on breadboard. Connect VCC=5V to pin 14, GND to pin 7. (b) Wire inputs to switches SW1, SW2, SW3. Wire output to LED. (c) Switch ON and complete truth table for both sides of each law. Confirm columns match.<br><br>
<b>Verilog Dataflow example:</b><br>
<code>module demorgan(A, B, L, R);<br>  input A, B;<br>  output L, R;<br>  assign L = ~(A &amp; B);  // NAND<br>  assign R = ~A | ~B;   // De Morgan equivalent<br>endmodule</code><br><br>
<b>Lesson Task:</b> Prove commutative law using gates and Verilog (A+B = B+A, A·B = B·A).`,
["L1=(A*B)'","R1=A'+B'","L2=(A+B)'","R2=A'*B'","P=A*(B+C)","Q=A*B+A*C"],
'Challenge: Build both sides of De Morgan\'s NAND law (L1 and R1) on the canvas. Press Generate → Truth Table and confirm both columns are identical for all A,B combinations.'],

// LAB 4 ─ Boolean Simplification
['Lesson 4','Boolean Simplification & K-Maps','Reduce expressions to minimum literals',
`<b>Objective:</b> Simplify Boolean expressions to the minimum number of literals, then demonstrate on breadboard.<br><br>
<b>Parts Required:</b> IC 7408 (AND), IC 7432 (OR), IC 7404 (NOT)<br><br>
<b>Theory:</b> Boolean algebra rules allow reducing complex expressions to simpler ones requiring fewer gates — cheaper, faster circuits.<br><br>
<b>Example 1 — Simplify AB + A(B+C) + B(B+C):</b><br>
Step 1: AB + AB + AC + B² + BC (distribute)<br>
Step 2: AB + AC + B + BC (B²=B)<br>
Step 3: AB + AC + B(1+C) (factor)<br>
Step 4: AB + AC + B (1+C=1)<br>
Step 5: B(A+1) + AC = B + AC ✓<br>
<b>Result: F = AC + B</b><br><br>
<b>Example 2 — Simplify AB + ACD + ACD′:</b><br>
= AB + AC(D + D′) = AB + AC(1) = AB + AC = A(B+C)<br>
<b>Result: F = A(B+C)</b><br><br>
<b>K-Map Method:</b> Plot minterms on a Karnaugh map. Group 1s in groups of 1, 2, 4, or 8. Larger groups = simpler expressions. Groups can wrap around edges.<br><br>
<b>Lesson Task — Simplify using Boolean properties:</b><br>
F = A·B·C + A′ + A·B′·C<br>
Hint: = A(BC + B′C) + A′ = A·C(B + B′) + A′ = AC + A′<br>
<b>Answer: F = AC + A′</b><br><br>
<b>Procedure:</b> Verify gates → Connect power → Wire as per diagram → Apply inputs → Observe output and verify truth table.`,
["F=A*B+A*(B+C)+B*(B+C)","S=A*C+B","G=A*B*C+A'+A*B'*C","H=A'+C"],
'Challenge: Build the complex F and the simplified S on the canvas. Press Generate → Truth Table — both output columns must match perfectly. Then try the K-Map tab: enter A*B+A*(B+C)+B*(B+C) and click Apply to see the minimisation.'],

// LAB 5 ─ Adders & Subtractors
['Lesson 5','Adders & Subtractors','Half and full adder/subtractor design and verification',
`<b>Objective:</b> Design and construct half adder, full adder, half subtractor and full subtractor circuits and verify truth tables.<br><br>
<b>Parts Required:</b> IC 7408 (AND), IC 7486 (XOR), IC 7404 (NOT), IC 7432 (OR)<br><br>
<b>Half Adder:</b> Two inputs (A, B), two outputs (Sum S and Carry C).<br>
• Sum S = A ⊕ B (XOR gate)<br>
• Carry C = A · B (AND gate)<br>
Truth table: 0+0=00, 0+1=01, 1+0=01, 1+1=10<br><br>
<b>Full Adder:</b> Three inputs (A, B, Cin), two outputs (Sum, Cout).<br>
• Sum = A ⊕ B ⊕ Cin<br>
• Cout = AB + (A ⊕ B)·Cin<br>
Built from two half adders + OR gate. Chains allow adding multi-bit numbers.<br><br>
<b>Half Subtractor:</b> Two inputs (A, B), outputs (Difference D, Borrow Bo).<br>
• Difference D = A ⊕ B (XOR)<br>
• Borrow Bo = A′·B (AND with NOT on A)<br><br>
<b>Full Subtractor:</b> Three inputs (A, B, Bin), outputs (Difference D, Borrow Bo).<br>
• D = A ⊕ B ⊕ Bin<br>
• Bo = A′·B + (A ⊕ B)′·Bin<br>
Built from two half subtractors + OR gate.<br><br>
<b>K-Map for Half Adder Sum:</b> SUM = A′B + AB′ (same as XOR)<br>
<b>K-Map for Half Adder Carry:</b> CARRY = AB<br>
<b>K-Map for Full Adder Carry:</b> CARRY = AB + BC + AC<br><br>
<b>Procedure:</b> Verify gates → Connect VCC=5V, GND → Wire per schematic → Apply all input combinations → Verify truth table outputs.<br><br>
<b>Verilog:</b><br>
<code>module half_adder(A, B, S, C);<br>  input A, B; output S, C;<br>  assign S = A ^ B;<br>  assign C = A &amp; B;<br>endmodule</code>`,
["S=A^B","C=A*B"],
'Challenge: Build the half adder (S and C outputs). Then extend to a full adder by adding a Cin switch: Sum = A⊕B⊕C and Cout = AB+(A⊕B)·C. Try all 8 input combinations and verify.'],

// LAB 6 ─ Gray Code Converter
['Lesson 6','Gray Code Converter','Binary ↔ Gray code conversion using XOR gates',
`<b>Objective:</b> Design and implement 4-bit Binary-to-Gray and Gray-to-Binary code converters.<br><br>
<b>Parts Required:</b> IC 7486 (XOR gate, quad 2-input)<br><br>
<b>Theory:</b> Gray code is a non-weighted code where adjacent values differ by only ONE bit. This prevents glitches in sensors and mechanical encoders. A code converter makes two systems compatible even when they use different binary codes.<br><br>
<b>Binary to Gray Conversion:</b><br>
Inputs: B3, B2, B1, B0 (MSB to LSB)<br>
Outputs: G3, G2, G1, G0<br>
• G3 = B3<br>
• G2 = B3 ⊕ B2<br>
• G1 = B2 ⊕ B1<br>
• G0 = B1 ⊕ B0<br>
Rule: Keep MSB, XOR each adjacent pair.<br><br>
<b>Gray to Binary Conversion:</b><br>
Inputs: G3, G2, G1, G0<br>
Outputs: B3, B2, B1, B0<br>
• B3 = G3<br>
• B2 = B3 ⊕ G2<br>
• B1 = B2 ⊕ G1<br>
• B0 = B1 ⊕ G0<br>
Rule: Keep MSB, XOR each output with next Gray bit (cascaded).<br><br>
<b>Truth Table Sample (4-bit):</b><br>
Binary 0000 → Gray 0000<br>
Binary 0001 → Gray 0001<br>
Binary 0010 → Gray 0011<br>
Binary 0011 → Gray 0010<br>
Binary 0100 → Gray 0110<br>
(Only one bit changes between adjacent rows!)<br><br>
<b>Verilog:</b><br>
<code>module bin_to_gray(B, G);<br>  input [3:0] B; output [3:0] G;<br>  assign G[3] = B[3];<br>  assign G[2] = B[3] ^ B[2];<br>  assign G[1] = B[2] ^ B[1];<br>  assign G[0] = B[1] ^ B[0];<br>endmodule</code><br><br>
<b>Procedure:</b> Use IC 7486 (XOR). Connect VCC=5V to pin 14, GND to pin 7. Wire B3–B0 to switches, G3–G0 to LEDs. Walk through all 16 input combinations and verify outputs.`,
["G3=A","G2=A^B","G1=B^C","G0=C^D"],
'Challenge: Build the Binary-to-Gray converter on the canvas (A=B3, B=B2, C=B1, D=B0). Step through A=0000 to 1111 and verify that only one LED changes at each step. Use Check my circuit to verify all 16 rows.'],

// LAB 7 ─ BCD / Excess-3
['Lesson 7','BCD ↔ Excess-3 Converter','Code conversion using K-map derived logic',
`<b>Objective:</b> Design and implement 4-bit BCD-to-Excess-3 and Excess-3-to-BCD converters.<br><br>
<b>Parts Required:</b> IC 7486 (XOR), IC 7408 (AND), IC 7432 (OR), IC 7404 (NOT)<br><br>
<b>Theory:</b> Excess-3 (XS-3) code represents each decimal digit as its binary equivalent plus 3. It is a self-complementing code useful for BCD arithmetic.<br>
BCD digit 0 (0000) → XS-3: 0011<br>
BCD digit 5 (0101) → XS-3: 1000<br>
BCD digit 9 (1001) → XS-3: 1100<br><br>
<b>BCD to Excess-3 — Boolean Expressions (from K-map minimisation):</b><br>
Let inputs be A(MSB), B, C, D(LSB):<br>
• E3 = A + BC + BD<br>
• E2 = B′C + B′D + BC′D′<br>
• E1 = C′D′ + CD<br>
• E0 = D′<br>
(Inputs 1010–1111 are don\'t-cares)<br><br>
<b>Excess-3 to BCD — Boolean Expressions:</b><br>
Let inputs be X1, X2, X3, X4 (XS-3 code):<br>
• A = X1·X2 + X3·X4·X1<br>
• B = X2′·X3 + X2′·X4 + X2·X3′·X4′<br>
• C = X3′·X4′ + X3·X4<br>
• D = X4′<br><br>
<b>Truth Table (BCD → XS-3, first 5 rows):</b><br>
A B C D → E3 E2 E1 E0<br>
0 0 0 0 → 0  0  1  1 (0+3=3)<br>
0 0 0 1 → 0  1  0  0 (1+3=4)<br>
0 0 1 0 → 0  1  0  1 (2+3=5)<br>
0 0 1 1 → 0  1  1  0 (3+3=6)<br>
0 1 0 0 → 0  1  1  1 (4+3=7)<br><br>
<b>Procedure:</b> Implement using IC 7486 (XOR), 7408 (AND), 7432 (OR), 7404 (NOT). Connect inputs A–D to switches, outputs E3–E0 to LEDs. Verify truth table for digits 0–9.<br><br>
<b>Verilog:</b><br>
<code>module bcd_to_xs3(BCD, XS3);<br>  input [3:0] BCD;<br>  output [3:0] XS3;<br>  assign XS3 = BCD + 4\'b0011;<br>endmodule</code>`,
["W=A+B*C+B*D","X=B'*C+B'*D+B*C'*D'","Y=C'*D'+C*D","Z=D'"],
'Challenge: Build the BCD-to-Excess-3 converter. Set switches to 0101 (decimal 5) and confirm LEDs W, X, Y, Z show 1000 (which is 5+3=8 in binary). Press Check my circuit to verify digits 0–9.',null,1],

// LAB 8 ─ Magnitude Comparator
['Lesson 8','Magnitude Comparator','Compare two binary numbers — greater, less, or equal',
`<b>Objective:</b> Design and implement a 2-bit magnitude comparator using basic gates. Study IC 7485 (4-bit comparator).<br><br>
<b>Parts Required:</b> IC 7408 (AND×2), IC 7486 (XOR), IC 7432 (OR), IC 7404 (NOT), IC 7485 (4-bit comparator×2)<br><br>
<b>Theory:</b> A magnitude comparator determines whether number A is greater than, equal to, or less than number B. Outputs are three signals: A&gt;B, A=B, A&lt;B.<br><br>
<b>For 2-bit numbers A = A1A0 and B = B1B0:</b><br>
Define Xi = Ai ⊕ Bi (XNOR gives 1 when bits are equal):<br>
• x1 = (A1 ⊕ B1)′ = XNOR(A1,B1)<br>
• x0 = (A0 ⊕ B0)′ = XNOR(A0,B0)<br><br>
<b>Comparison expressions:</b><br>
• A = B: x1 · x0 (both bit pairs equal)<br>
• A &gt; B: A1·B1′ + x1·A0·B0′<br>
• A &lt; B: A1′·B1 + x1·A0′·B0<br><br>
<b>For 4-bit comparison (general):</b><br>
A &gt; B = A3B3′ + x3·A2B2′ + x3x2·A1B1′ + x3x2x1·A0B0′<br>
A &lt; B = A3′B3 + x3·A2′B2 + x3x2·A1′B1 + x3x2x1·A0′B0<br>
A = B = x3 · x2 · x1 · x0<br><br>
<b>IC 7485 Pin Functions:</b> Compares two 4-bit numbers (A3–A0, B3–B0). Has cascade inputs (A&gt;Bin, A=Bin, A&lt;Bin) for chaining multiple comparators. Outputs: A&gt;B, A=B, A&lt;B. Chain two 7485s for 8-bit comparison.<br><br>
<b>Truth Table (2-bit, A vs B, sample rows):</b><br>
A1 A0 B1 B0 → A&gt;B A=B A&lt;B<br>
0  0  0  0 →  0    1    0<br>
0  1  0  0 →  1    0    0<br>
0  0  0  1 →  0    0    1<br>
1  1  0  1 →  1    0    0<br><br>
<b>Procedure:</b> Wire A bits and B bits to separate switch banks. Connect outputs to 3 LEDs (GT, EQ, LT). Verify all 16 combinations. Only ONE output should be HIGH at any time.`,
["GT=A*C'+(A^C)'*B*D'","LT=A'*C+(A^C)'*B'*D","EQ=(A^C)'*(B^D)'"],
'Challenge: Build the 2-bit comparator (A=A,B and C=B0,D=B1 from the second number). Wire GT, EQ, LT outputs. Set A=10, B=01 — only GT should be HIGH. Set A=B — only EQ should be HIGH.'],

// LAB 10 ─ MUX / DEMUX
['Lesson 10','Multiplexer & De-Multiplexer','Data selection and distribution with ICs 74150 & 74154',
`<b>Objective:</b> Design and implement multiplexer (MUX) and de-multiplexer (DEMUX). Study IC 74150 (16-to-1 MUX) and IC 74154 (1-to-16 DEMUX/decoder).<br><br>
<b>Parts Required:</b> IC 7411 (3-input AND×2), IC 7432 (OR), IC 7404 (NOT)<br><br>
<b>Multiplexer Theory:</b> A MUX selects ONE of 2ⁿ input data lines and routes it to a single output. n selection lines determine which input is selected.<br><br>
<b>4-to-1 MUX (2 select lines S1, S0):</b><br>
Y = D0·S1′·S0′ + D1·S1′·S0 + D2·S1·S0′ + D3·S1·S0<br><br>
<b>4-to-1 MUX Function Table:</b><br>
S1 S0 → Output Y<br>
0  0  → D0<br>
0  1  → D1<br>
1  0  → D2<br>
1  1  → D3<br><br>
<b>De-Multiplexer Theory:</b> A DEMUX takes data from ONE input line and routes it to ONE of 2ⁿ output lines. The decoder can also function as a DEMUX.<br><br>
<b>1-to-4 DEMUX:</b><br>
Y = X·S1′·S0′ + X·S1′·S0 + X·S1·S0′ + X·S1·S0<br>
Each output = input X AND the decoder enable for that position.<br><br>
<b>IC 74150 (16-to-1 MUX):</b> 16 data inputs (D0–D15), 4 select inputs (A, B, C, D), active-LOW enable, one output W (active-LOW). Used for large data selection.<br><br>
<b>IC 74154 (4-to-16 Decoder/DEMUX):</b> 4 address inputs (A0–A3), 2 active-LOW enables (G1, G2), 16 active-LOW outputs. Used as DEMUX with G1 as data input.<br><br>
<b>Verilog (4-to-1 MUX):</b><br>
<code>module mux4to1(D0,D1,D2,D3,S,Y);<br>  input D0,D1,D2,D3;<br>  input [1:0] S;<br>  output Y;<br>  assign Y = S[1]?(S[0]?D3:D2):(S[0]?D1:D0);<br>endmodule</code><br><br>
<b>Procedure:</b> Connect D0–D3 and S0, S1 to switches. LED Y shows output. Walk S through 00→01→10→11 and verify Y copies D0, D1, D2, D3 respectively.`,

// LAB 11 ─ Encoder / Decoder
['Lesson 11','Encoder & Decoder','Octal encoder and 2-to-4 decoder with ICs 7445 & 74147',
`<b>Objective:</b> Design and implement an encoder and decoder using logic gates. Study IC 7445 (BCD-to-decimal decoder) and IC 74147 (priority encoder).<br><br>
<b>Parts Required:</b> IC 7410 (3-input NAND×2), IC 7432 (OR×3), IC 7404 (NOT)<br><br>
<b>Encoder Theory:</b> An encoder performs the inverse of a decoder. It has 2ⁿ input lines and n output lines. The output generates a binary code corresponding to the active input. Only ONE input should be HIGH at any time.<br><br>
<b>Octal-to-Binary Encoder (8 inputs → 3 outputs):</b><br>
Inputs: Y1–Y7 (Y0 = all zeros).<br>
Outputs: A (MSB), B, C (LSB)<br>
• A = Y4 + Y5 + Y6 + Y7<br>
• B = Y2 + Y3 + Y6 + Y7<br>
• C = Y1 + Y3 + Y5 + Y7<br><br>
<b>Encoder Truth Table:</b><br>
Input → Output (A B C)<br>
Y1 = 1 → 0 0 1<br>
Y2 = 1 → 0 1 0<br>
Y3 = 1 → 0 1 1<br>
Y4 = 1 → 1 0 0<br>
Y5 = 1 → 1 0 1<br>
Y6 = 1 → 1 1 0<br>
Y7 = 1 → 1 1 1<br><br>
<b>Decoder Theory:</b> A decoder converts a coded n-bit input into one of 2ⁿ unique outputs. Each input code activates exactly one output.<br><br>
<b>2-to-4 Decoder (2 inputs → 4 outputs, with Enable E):</b><br>
• D0 = E′·A′·B′ (active LOW when E=0, A=0, B=0)<br>
• D1 = E′·A′·B<br>
• D2 = E′·A·B′<br>
• D3 = E′·A·B<br>
(E=1 disables all outputs — all go HIGH for active-LOW outputs)<br><br>
<b>Decoder Truth Table:</b><br>
E A B → D0 D1 D2 D3<br>
1 × × →  1  1  1  1 (disabled)<br>
0 0 0 →  0  1  1  1<br>
0 0 1 →  1  0  1  1<br>
0 1 0 →  1  1  0  1<br>
0 1 1 →  1  1  1  0<br><br>
<b>IC 7445 (BCD-to-Decimal):</b> 4-bit BCD input (A–D), 10 active-LOW outputs (0–9). Unused outputs 10–15 also go LOW. Used for driving 7-segment displays.<br><br>
<b>IC 74147 (Priority Encoder):</b> 9 active-LOW inputs, 4 active-LOW BCD outputs. Highest active input takes priority.`,
["X=D+E+F+G","Y=B+C+F+G","Z=A+C+E+G"],

// LAB 12 ─ Flip Flops
['Lesson 12','Flip-Flop Study','D and JK flip-flops — the memory elements of sequential logic',
`<b>Objective:</b> Design and verify D flip-flop (IC 7474) and JK flip-flop (IC 7476).<br><br>
<b>Parts Required:</b> IC 7476 (JK Flip-Flop), IC 7474 (D Flip-Flop)<br><br>
<b>D Flip-Flop Theory:</b><br>
The D (Data) flip-flop eliminates the forbidden state of SR flip-flops by connecting an inverter between S and R, so S=D and R=D′. The output Q copies the D input only at the active clock edge. Between clock edges, Q is "latched" — it remembers its last state regardless of D.<br>
• If D=1 at rising clock edge → Q goes to 1<br>
• If D=0 at rising clock edge → Q goes to 0<br>
• Between clock edges → Q holds its value<br><br>
<b>D Flip-Flop Truth Table:</b><br>
CLK  D → Q(next)<br>
↑    0 → 0 (Reset)<br>
↑    1 → 1 (Set)<br>
0 or 1 → Q (No change — latched)<br><br>
<b>IC 7474 — Dual D Flip-Flop:</b> Two independent D flip-flops, positive-edge triggered. Each has CLK, D, Q, Q̄, plus asynchronous PRE (preset) and CLR (clear) active-LOW inputs.<br><br>
<b>JK Flip-Flop Theory:</b><br>
The JK flip-flop is the most versatile flip-flop. It adds cross-coupled feedback to the SR design, eliminating the forbidden J=K=1 state. Instead, J=K=1 TOGGLES the output. Operates on the falling clock edge (IC 7476).<br><br>
<b>JK Flip-Flop Truth Table:</b><br>
J  K  CLK → Q(next)<br>
0  0  ↓   → Q (No change)<br>
0  1  ↓   → 0 (Reset)<br>
1  0  ↓   → 1 (Set)<br>
1  1  ↓   → Q̄ (Toggle)<br><br>
<b>IC 7476 — Dual JK Flip-Flop:</b> Negative-edge triggered. Each half has J, K, CLK, Q, Q̄, plus asynchronous PRE and CLR. J=K=1 causes toggling which can cause "race" conditions in slow designs — use edge-triggered master-slave versions for reliable operation.<br><br>
<b>Procedure:</b> Connect CLK to a push-button switch. Connect D (or J,K) to toggle switches. Connect Q and Q̄ to LEDs. Apply PRE=1, CLR=1 (inactive). Toggle D and press clock; observe Q follows D on the rising edge.`,
null,
'Challenge: Load the D flip-flop from the Load example menu. Set D=1 and press ⏱ (clock pulse) — watch Q go to 1. Set D=0 and press ⏱ again — Q goes back to 0. The circuit "remembers" state between pulses. Then try the JK flip-flop example.','D flip-flop'],

// LAB 13 ─ Shift Register
['Lesson 13','Shift Register','Serial-in Parallel-out (SIPO) and universal shift register IC 74194',
`<b>Objective:</b> Design and verify serial-in parallel-out (SIPO) shift register. Study IC 74194 (Universal 4-bit Shift Register).<br><br>
<b>Parts Required:</b> IC 74194 (Universal Shift Register)<br><br>
<b>Shift Register Theory:</b> A shift register is a chain of D flip-flops where the output of each becomes the input of the next. Data shifts one position along the chain with every clock pulse.<br><br>
<b>Four Operating Modes:</b><br>
• <b>SIPO (Serial-In Parallel-Out):</b> Feed bits in one at a time; read all 4 outputs simultaneously after 4 clocks. Converts serial → parallel.<br>
• <b>SISO (Serial-In Serial-Out):</b> Shift data through one bit at a time for delay/buffering.<br>
• <b>PISO (Parallel-In Serial-Out):</b> Load 4 bits at once; shift out one bit per clock. Converts parallel → serial.<br>
• <b>PIPO (Parallel-In Parallel-Out):</b> Load and output all bits simultaneously (like a latch).<br><br>
<b>SIPO Operation (4-bit example):</b><br>
Start: QA QB QC QD = 0 0 0 0<br>
After clock 1 (D=1): 1 0 0 0<br>
After clock 2 (D=0): 0 1 0 0<br>
After clock 3 (D=0): 0 0 1 0<br>
After clock 4 (D=1): 1 0 0 1<br>
Input serial stream 1001 is now available in parallel as QA=1, QB=0, QC=0, QD=1.<br><br>
<b>IC 74194 — 4-bit Bidirectional Universal Shift Register:</b><br>
Control pins S0, S1 set mode:<br>
S1 S0 → Mode<br>
0  0  → Hold (no shift)<br>
0  1  → Shift Right<br>
1  0  → Shift Left<br>
1  1  → Parallel Load<br>
Has SR (serial right input), SL (serial left input), parallel inputs A–D, CLR (clear), CLK.<br><br>
<b>Verilog:</b><br>
<code>module sipo(SI, CLK, RST, Q);<br>  input SI, CLK, RST;<br>  output reg [3:0] Q;<br>  always @(posedge CLK)<br>    if(RST) Q &lt;= 0;<br>    else Q &lt;= {Q[2:0], SI};<br>endmodule</code><br><br>
<b>Procedure:</b> Set S0=1, S1=0 for right-shift mode. Connect SI to data switch. Connect QA–QD to LEDs. Press clock 4 times after setting each input bit and observe the serial-to-parallel conversion.`,
null,
'Challenge: Load the Shift register example. Set D=1 then press ⏱ — the 1 enters QA. Set D=0 and press ⏱ three more times. Watch the 1 travel to QB, QC, QD. After 4 pulses read QA–QD.','Shift register'],

// LAB 14 ─ Decade Counter
['Lesson 14','Decade Counter','Mod-10 BCD counter using IC 7490 (74LS90)',
`<b>Objective:</b> Design and verify a 4-bit decade (BCD) counter using IC 7490.<br><br>
<b>Parts Required:</b> IC 7490 (Decade Counter)<br><br>
<b>Theory:</b> A decade counter counts 0 through 9 (BCD: 0000 to 1001) then resets to 0 on the 10th pulse. It requires at least 4 flip-flops. The modulus (total count states) of this counter is 10.<br><br>
<b>IC 74LS90 Internal Structure:</b><br>
Contains two separate counters:<br>
• MOD-2 counter: one JK flip-flop driven by CLK A input → output QA<br>
• MOD-5 counter: three JK flip-flops driven by CLK B input → outputs QB, QC, QD<br>
Connect QA to CLK B externally to form a MOD-10 decade counter.<br><br>
<b>BCD Counter Sequence:</b><br>
Count | QD QC QB QA<br>
  0   |  0  0  0  0<br>
  1   |  0  0  0  1<br>
  2   |  0  0  1  0<br>
  3   |  0  0  1  1<br>
  4   |  0  1  0  0<br>
  5   |  0  1  0  1<br>
  6   |  0  1  1  0<br>
  7   |  0  1  1  1<br>
  8   |  1  0  0  0<br>
  9   |  1  0  0  1<br>
 10   → Resets to 0000<br><br>
<b>Reset Pins (R1, R2):</b> Both HIGH → resets counter to 0000 immediately, regardless of clock.<br>
<b>Set Pins (S1, S2):</b> Both HIGH → sets counter to 9 (1001) immediately.<br>
Clock triggers on the NEGATIVE edge (HIGH → LOW transition).<br><br>
<b>Cascade for larger counts:</b> Connect QD of one counter to CLK A of the next. Two 7490s give 0–99 (BCD decade), three give 0–999, etc.<br><br>
<b>Verilog:</b><br>
<code>module decade_counter(CLK, RST, Q);<br>  input CLK, RST;<br>  output reg [3:0] Q;<br>  always @(posedge CLK)<br>    if(RST || Q==4\'d9) Q &lt;= 0;<br>    else Q &lt;= Q + 1;<br>endmodule</code><br><br>
<b>Procedure:</b> Connect CLK A (pin 14) to a push-button. Connect QA–QD to four LEDs. Ground R1, R2, S1, S2 (inactive). Press button 10 times. LEDs should show 0000→0001→...→1001→0000. Connect QA to CLK B for divide-by-10 operation.`,

let LIVE_ERR='';
async function backend(){if(ls.g('noLive')==='1'){LIVE_ERR='Disconnected on this browser. Press Connect to reconnect.';return}
 let c=null;for(let k=0;k<8&&!(c=window.claude);k++)await new Promise(r=>setTimeout(r,200));
 if(!c){LIVE_ERR='the shared database service is not available on this page';return}
 try{const u=await c.use('user'),d=await c.use('db');if(!u||!d){LIVE_ERR='access to the shared database was not granted';return}PL=d;UID=await u.id();PADM=!!((await u.isOwner())||(await u.canEdit()));LIVE=1;LIVE_ERR=''}catch(e){LIVE=0;LIVE_ERR='connection failed: '+((e&&e.message)||e)}}
const sub=(ref,fn)=>new Promise(r=>{let f=1;ref.onSnapshot(s=>{try{fn(s)}catch(e){}if(f){f=0;r()}else live()},()=>{if(f){f=0;r()}})});
function toast(t){const d=document.createElement('div');d.className='banner';d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:70;text-align:center;cursor:pointer';d.textContent=t;d.onclick=()=>d.remove();document.body.appendChild(d);setTimeout(()=>d.remove(),7000)}

async function liveStart(){UC=PL.collection('data/users/'+UID);const defSet=JSON.stringify(DB.set);

  sub(PL.collection('notifs'),s=>{const old=new Set(DB.notifs.map(n=>n.id));DB.notifs=s.docs.map(x=>({id:+x.id,...x.data()})).sort((a,b)=>b.id-a.id);if(ready&&me&&me.role!=='admin')DB.notifs.filter(n=>!old.has(n.id)).forEach(n=>toast('🔔 '+n.text))}),
  sub(UC.doc('acct'),s=>{ACCT=s.exists?s.data():null;if(me&&ACCT){me=ACCT;me.role=PADM?'admin':'user';me.read=me.read||[]}}),

  PADM?sub(PL.collection('profiles'),s=>{DB.users=s.docs.map(x=>({uid:x.id,...x.data()})).filter(u=>u.status!=='removed')}):0]);
 if(PADM&&!ACCT){ACCT={email:'admin@gmail.com',name:'Site Owner',hash:await sha('Admin@123'),role:'admin',read:[],joined:Date.now()};try{await UC.doc('acct').set(ACCT)}catch(e){}}

async function doReg(){const n=$('#n').value.trim(),e=$('#e').value.trim().toLowerCase(),p=$('#p').value;

function upPic(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=200;const m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,200,200);me.pic=c.toDataURL('image/jpeg',.82);save();render();say('Photo updated ✨')};im.src=r.result};r.readAsDataURL(f)}
async function chPw(){const n=$('#np').value;if(me.hash&&me.hash!==await sha($('#cp').value))return say('Current password is wrong',0);if(n.length<6)return say('New password must be at least 6 characters',0);if(n!==$('#np2').value)return say('Passwords do not match',0);me.hash=await sha(n);save();render();say('Password changed ✅')}
async function chEm(){const e=$('#ne').value.trim().toLowerCase();if(!GM.test(e))return say('Only @gmail.com addresses are allowed',0);if(DB.users.some(u=>u!==me&&u.email===e))return say('That email is already used',0);if(me.hash&&me.hash!==await sha($('#ep').value))return say('Current password is wrong',0);me.email=e;ls.g('sess')?ls.s('sess',e):sessionStorage.setItem('sess',e);if(ls.g('remEmail'))ls.s('remEmail',e);save();render();say('Email changed ✅')}
async function delMe(){if(await dlg('Delete your account permanently? You will need to register again.',1)){if(LIVE){try{await UC.doc('acct').delete();await PL.doc('profiles/'+UID).delete()}catch(e){}ACCT=null}else{DB.users=DB.users.filter(u=>u!==me);save()}ls.d('remEmail');logout()}}

/* ---------- ADMIN ---------- */
function adminView(){const t=(k,l)=>`<button class="btn ${aTab==k?'':'o'} s" onclick="aTab='${k}';render()">${l}</button>`;
 return nav('')+`<div class="wrap"><div id="atabs" style="display:flex;gap:8px;flex-wrap:wrap;padding:12px 0">${t('dash','Dashboard')}${t('content','Content')}${t('design','Design & Settings')}${t('users','Users')}${t('notif','Notifications')}${t('studio','Studio')}<button class="btn ${aTab=='lessons'?'':'o'} s" onclick="aTab='lessons';render();PENDING='lb';pushSync(true)">Lessons</button>${t('prev','Preview as user')}</div>${aBody()}</div>`}
function aBody(){const s=DB.set,us=DB.users.filter(u=>u.role!='admin'&&u.uid!==UID);if(aTab=='set')return setView();if(aTab=='studio'||aTab=='lessons')return'';
 if(aTab=='dash')return`<div class="grid"><div class="card"><h2 style="margin:0">${us.length}</h2>Registered users</div><div class="card"><h2 style="margin:0">${DB.blocks.length}</h2>Content blocks (${DB.blocks.filter(b=>b.vis).length} visible)</div><div class="card"><h2 style="margin:0">${DB.notifs.length}</h2>Notifications sent</div><div class="card"><h2 style="margin:0">${DB.custom.length}</h2>Custom components</div><div class="card"><h2 style="margin:0">${DB.lessons.length}</h2>Extra lessons</div></div><div class="card"><b>Welcome back, ${esc(me.name)}.</b><p style="color:var(--mu)">Edit content, change the design, manage users, send notifications, and open the Studio tab to add new components and lessons.</p>${connInfo()}</div>`;
 if(aTab=='content')return`<div class="card"><h3 style="margin-top:0">Add / edit block</h3><input type="hidden" id="bid"><label>Title</label><input id="bt"><label>Text</label><textarea id="bx" rows="3"></textarea>
 <div class="sw"><input type="checkbox" id="bv" checked><label style="margin:0" for="bv">Visible to users</label></div><div class="sw" style="margin:8px 0 12px"><input type="checkbox" id="bn" checked><label style="margin:0" for="bn">Notify users about this update</label></div><button class="btn" onclick="saveBlock()">Save block</button></div>
 ${DB.blocks.map(b=>`<div class="card"><div class="row" style="border:0;padding:0"><b>${esc(b.title)}</b><span class="tag">${b.vis?'Visible':'Hidden'}</span></div><p style="color:var(--mu);white-space:pre-wrap">${esc(b.text)}</p><button class="btn o s" onclick="editB(${b.id})">Edit</button> <button class="btn o s" onclick="togB(${b.id})">${b.vis?'Hide':'Show'}</button> <button class="btn d s" onclick="delB(${b.id})">Delete</button></div>`).join('')}`;
 if(aTab=='design'){const ck=(k,l)=>`<div class="sw" style="margin-bottom:8px"><input type="checkbox" id="s_${k}" ${s[k]?'checked':''}><label style="margin:0" for="s_${k}">${l}</label></div>`;
 return`<div class="card"><h3 style="margin-top:0">Design</h3><label>Website name</label><input id="s_name" value="${esc(s.name)}"><label>Tagline</label><input id="s_tagline" value="${esc(s.tagline)}"><label>Hero headline</label><input id="s_hero" value="${esc(s.hero)}"><label>Announcement banner (empty = none)</label><input id="s_banner" value="${esc(s.banner)}"><label>Main colour</label><input id="s_color" type="color" value="${s.color}" style="height:44px">
 <h3>What users can do / see</h3>${ck('allowReg','Allow new registrations')}${ck('showNotif','Users can see notifications')}${ck('showProfile','Users can open Settings (name, photo, password)')}${ck('userTheme','Users can choose light/dark theme')}
 <div class="sw" style="margin:12px 0"><input type="checkbox" id="s_n" checked><label style="margin:0" for="s_n">Notify users about these changes</label></div><button class="btn" onclick="saveSet()">Save settings</button></div>`}
 if(aTab=='users')return`<div class="card"><h3 style="margin-top:0">Users (${us.length})</h3>${us.map(u=>`<div class="row"><span>${esc(u.name)}<br><small style="color:var(--mu)">${esc(u.email)} ${u.google?'· Google':''} ${u.joined?'· joined '+new Date(u.joined).toLocaleDateString():''}</small></span><button class="btn d s" onclick="delU('${esc(u.email)}')">Delete</button></div>`).join('')||'<p style="color:var(--mu)">No users yet.</p>'}</div>`;
 if(aTab=='notif')return`<div class="card"><h3 style="margin-top:0">Send notification</h3><textarea id="nt" rows="2" placeholder="Message to all users"></textarea><button class="btn" onclick="sendN()">Send</button></div><div class="card"><h3 style="margin-top:0">History</h3>${DB.notifs.map(n=>`<div class="row"><span>${esc(n.text)}</span><span><span class="tag">${n.time}</span> <button class="btn d s" onclick="delN(${n.id})">✕</button></span></div>`).join('')||'<p style="color:var(--mu)">None yet.</p>'}</div>`;
 if(aTab=='prev')return`<div class="hero"><h1>${esc(s.hero)}</h1><p style="margin:0">${esc(s.tagline)}</p></div><div class="grid">${DB.blocks.filter(b=>b.vis).map(b=>`<div class="card"><h3 style="margin-top:0">${esc(b.title)}</h3><p style="color:var(--mu)">${esc(b.text)}</p></div>`).join('')}</div>`}
function saveBlock(){const t=$('#bt').value.trim();if(!t)return alert('Enter a title');const id=+$('#bid').value,o={title:t,text:$('#bx').value,vis:$('#bv').checked};
 if(id)Object.assign(DB.blocks.find(b=>b.id==id),o);else DB.blocks.push({id:Date.now(),...o});
 if($('#bn').checked&&o.vis)notify((id?'Updated: ':'New: ')+t);save();render()}
function editB(id){const b=DB.blocks.find(x=>x.id==id);$('#bid').value=id;$('#bt').value=b.title;$('#bx').value=b.text;$('#bv').checked=b.vis;scrollTo(0,0)}
function togB(id){const b=DB.blocks.find(x=>x.id==id);b.vis=!b.vis;save();render()}
async function delB(id){if(await dlg('Delete this block?',1)){DB.blocks=DB.blocks.filter(b=>b.id!=id);save();render()}}
function saveSet(){const s=DB.set;['name','tagline','hero','banner','color'].forEach(k=>s[k]=$('#s_'+k).value);['allowReg','showNotif','showProfile','userTheme'].forEach(k=>s[k]=$('#s_'+k).checked);
 if($('#s_n').checked)notify('The website design/settings were updated.');save();render();alert('Saved')}
async function delU(e){if(await dlg('Delete '+e+'? They must register again.',1)){if(LIVE){const u=DB.users.find(x=>x.email==e);if(u)try{await PL.doc('profiles/'+u.uid).update({status:'removed'})}catch(x){dlg('Not allowed')}}else{DB.users=DB.users.filter(u=>u.email!=e);save();render()}}}
async function sendN(){const t=$('#nt').value.trim();if(!t)return dlg('Write a message first.');if(!DB.set.showNotif)await dlg('Notifications are switched off in Design & Settings, so users will not see this until you turn them on.');
 try{await notifyAsync(t);$('#nt').value='';dlg('✔ Sent'+(DB.users&&DB.users.length?' to '+DB.users.length+' user'+(DB.users.length==1?'':'s'):'')+'. It appears on their page right away.')}catch(e){dlg('Could not send: '+((e&&e.message)||e))}}
function delN(id){if(LIVE){PL.doc('notifs/'+id).delete().catch(()=>{});return}DB.notifs=DB.notifs.filter(n=>n.id!=id);save();render()}
function dlg(msg,ask){return new Promise(r=>{const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card" style="max-width:400px;width:100%"><p style="margin-top:0">${esc(msg)}</p><div style="display:flex;gap:8px;justify-content:flex-end">${ask?'<button class="btn o" id="dn">Cancel</button>':''}<button class="btn" id="dy">OK</button></div></div>`;document.body.appendChild(m);m.querySelector('#dy').onclick=()=>{m.remove();r(true)};if(ask)m.querySelector('#dn').onclick=()=>{m.remove();r(false)}})}
window.alert=m=>{dlg(m)};
const themeBtn=()=>me&&(me.role==='admin'||DB.set.userTheme)?'<button class="btn o s" title="Change theme" onclick="togTheme()">🌗</button>':'';
function togTheme(){me.theme=effTheme()=='dark'?'light':'dark';save();render()}
const SSRC=document.getElementById('ssrc').textContent.replace(/<\\\/script>/g,'<'+'/script>');
function loadStudio(){const f=$('#studio');f.srcdoc='';if(!me&&view!='guest')return;setTimeout(()=>{f.srcdoc=SSRC},30)}
function effTheme(){const t=me&&(me.role==='admin'||DB.set.userTheme)&&me.theme;return t||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}
function pushSync(g){const f=$('#studio');if(!f||!f.contentWindow||(!me&&view!='guest'))return;f.contentWindow.postMessage({t:'cs',theme:effTheme(),color:DB.set.color,custom:DB.custom,lessons:DB.lessons,lm:DB.lessonMeta||{},hd:DB.heads||{},admin:!!me&&me.role==='admin',guest:!me,uid:me?me.email:'',go:g&&PENDING?PENDING:undefined},'*');if(g&&PENDING)PENDING=null}
function studioShow(){const f=$('#studio'),on=me?(me.role==='admin'?(aTab=='studio'||aTab=='lessons'):tab=='studio'):view=='guest';f.style.display=on?'block':'none';document.body.classList.toggle('st',on);if(on){const b=$('#atabs')||$('.banner')||$('.nav'),t=Math.ceil(b.getBoundingClientRect().bottom);f.style.top=t+'px';f.style.height=Math.max(300,innerHeight-t)+'px'}}
addEventListener('resize',studioShow);
addEventListener('message',e=>{const d=e.data;if(!d||e.source!==$('#studio').contentWindow)return;if(d.t=='cs-ready')return pushSync(true);if(d.t=='cs-login'){if(!me)goAuth('login',d.want||null);return}if(!me||me.role!=='admin')return;
 if(d.t=='cs-heads'){DB.heads=DB.heads||{};Object.entries(d.heads||{}).forEach(([k,v])=>{if(v==null||v==='')delete DB.heads[k];else DB.heads[k]=v});save();pushSync()}
 if(d.t=='cs-lmeta'){DB.lessonMeta=DB.lessonMeta||{};const m=DB.lessonMeta[d.key]||{};Object.entries(d.meta||{}).forEach(([k,v])=>{if(v===null)delete m[k];else m[k]=v});DB.lessonMeta[d.key]=m;save();pushSync()}
 if(d.t=='cs-save'){if(d.kind=='component'){DB.custom=DB.custom.filter(c=>c.name!=d.data.name);DB.custom.push(d.data);notify('New in the studio: '+d.data.name+' component')}else{DB.lessons.push({...d.data,id:Date.now()});notify('New lesson: '+d.data.title)}save();pushSync()}
 if(d.t=='cs-del'){if(d.kind=='component')DB.custom=DB.custom.filter(c=>c.name!=d.key);else DB.lessons=DB.lessons.filter(l=>l.id!=d.key);save();pushSync()}});
init().then(loadStudio);

/* ---- internet required: block the app while offline ---- */
(function(){const o=document.createElement('div');o.id='noNet';o.style.cssText='position:fixed;inset:0;z-index:999;display:none;align-items:center;justify-content:center;background:rgba(15,10,30,.94);color:#fff;font:600 19px system-ui,sans-serif;text-align:center;padding:24px';o.innerHTML='<div>📡 Internet connection required<br><span style="font-weight:400;font-size:15px;opacity:.85;display:block;margin-top:8px">Circuit Studio works only online. It will continue when you reconnect.</span></div>';document.body.appendChild(o);const f=()=>{o.style.display=navigator.onLine?'none':'flex'};addEventListener('online',f);addEventListener('offline',f);f()})();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function showInstall(html,onclick){let b=document.getElementById('instApp');if(!b){b=document.createElement('button');b.id='instApp';b.style.cssText='position:fixed;right:14px;bottom:14px;z-index:90;border:0;border-radius:999px;padding:11px 18px;font:700 14px system-ui,sans-serif;color:#fff;background:linear-gradient(135deg,#6d28d9,#a855f7);box-shadow:0 8px 24px rgba(109,40,217,.35);cursor:pointer;max-width:calc(100vw - 28px)';document.body.appendChild(b)}b.innerHTML=html;b.onclick=onclick}
let DEFER_PROMPT=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFER_PROMPT=e;if(!isStandalone())showInstall('⬇ Install Circuit Studio',async()=>{DEFER_PROMPT.prompt();const c=await DEFER_PROMPT.userChoice;DEFER_PROMPT=null;if(c.outcome==='accepted')document.getElementById('instApp')?.remove()})});
addEventListener('appinstalled',()=>{DEFER_PROMPT=null;document.getElementById('instApp')?.remove()});
if(/iPhone|iPad|iPod/.test(navigator.userAgent)&&!isStandalone())addEventListener('load',()=>showInstall('⬆ Install: tap Share, then “Add to Home Screen”',()=>{const b=document.getElementById('instApp');if(b)b.remove()}));
